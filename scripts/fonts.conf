<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- macOS（制作環境）。存在しないディレクトリは fontconfig が黙って無視する。 -->
  <dir>/Users/ootori/Library/Fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <!-- Linux / CI。Poppins と Noto Sans JP を ~/.fonts か システムのフォント
       ディレクトリに置いておけば、Mac と同じ結果が出る。ここが無いと和文が
       すべて豆腐になり、テキストが欠けた画像が出来てしまう。 -->
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/tmp/fc-cache</cachedir>
</fontconfig>
